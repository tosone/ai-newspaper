<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI news · 目录</title>
<link rel="stylesheet" href="assets/newspaper.css">
<style>
  /* ── 索引页外壳 ─────────────────────────────────────────────────────── */
  body.index{
    --bar-h:42px;              /* 左 tabs 与右 reader-bar 同一高度，底边才对得齐 */
    padding:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;
  }
  /* 分享模式（?doc=<id>）：只留这一期 */
  body.shared .app-bar,body.shared .list-col{display:none}
  body.shared .app-main{grid-template-columns:1fr}
  .app-bar{
    flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:14px 22px 12px;border-bottom:3px double var(--rule);background:var(--paper);
  }
  .brand{display:flex;align-items:baseline;gap:12px;font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1}
  .brand::before{
    content:"";width:12px;height:12px;background:var(--accent);flex:none;
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:translateY(-4px);
  }
  .brand small{
    font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.22em;
    color:var(--ink-light);text-transform:uppercase;
  }
  .app-meta{font-family:var(--sans);font-size:10.6px;color:var(--ink-light);letter-spacing:.06em;text-align:right;line-height:1.7}

  .app-main{
    flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr;
    background:#cfc7b4;background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.3),transparent 60%);
  }

  /* ── 左栏 ───────────────────────────────────────────────────────────── */
  .list-col{min-height:0;display:flex;flex-direction:column;border-right:1px solid #b3aa95;background:var(--paper)}
  .tabs{
    flex:none;display:flex;height:var(--bar-h);border-bottom:1px solid var(--rule);
    font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;
  }
  .tabs button{
    flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0 6px;line-height:1;font:inherit;color:var(--ink-light);
    border-right:1px solid #d3cab5;position:relative;
  }
  .tabs button:last-child{border-right:0}
  .tabs button span.c{font-size:9.6px;font-weight:500;letter-spacing:0;opacity:.75;margin-left:4px}
  .tabs button[aria-selected="true"]{color:var(--ink);background:var(--paper-2)}
  .tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}

  .timeline{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 40px}
  .tl-year{margin:14px 0 8px;font-family:var(--sans);font-size:10.4px;letter-spacing:.2em;color:var(--ink-light)}
  .tl-year:first-child{margin-top:2px}
  .card{
    display:block;width:100%;text-align:left;
    appearance:none;font:inherit;color:inherit;cursor:pointer;
    background:var(--paper);border:1px solid #cbc2ad;border-left:3px solid #cbc2ad;
    padding:9px 12px 10px;margin:0 0 9px;
  }
  .card:hover{border-left-color:var(--ink)}
  .card[aria-current="true"]{border-left-color:var(--accent);background:var(--paper-2)}
  .card .date{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.04em}
  .card .head{display:block;margin-top:4px;font-size:12.8px;line-height:1.55;color:var(--ink-soft)}
  .card .meta{display:block;margin-top:5px;font-family:var(--sans);font-size:10px;color:var(--ink-light);letter-spacing:.02em}

  /* ── 右栏 ───────────────────────────────────────────────────────────── */
  .reader{min-height:0;display:flex;flex-direction:column}
  .reader-bar{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;
    height:var(--bar-h);padding:0 20px;line-height:1;
    border-bottom:1px solid var(--rule);background:var(--paper);
    font-family:var(--sans);font-size:11px;color:var(--ink-light);letter-spacing:.04em;
  }
  .reader-bar #readerTitle{
    min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .reader-bar b{color:var(--ink);font-weight:700;letter-spacing:.02em}
  .reader-bar .acts{display:flex;gap:14px;white-space:nowrap;flex:none}
  .reader-bar .share-hint{display:none}          /* 复制后的小提示，不占位、不改按钮文案 */
  .reader-bar .share-hint.on{
    display:inline-block;font-size:10px;color:var(--accent);
    border:1px solid var(--accent);padding:1px 6px;margin-left:-6px;
  }
  .reader-scroll{flex:1;min-height:0;overflow-y:auto;padding:20px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
         color:var(--ink-light);font-family:var(--sans);font-size:12.4px;text-align:center;line-height:2}
  .empty b{font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:800;letter-spacing:.04em}
  .empty code{
    font-family:var(--serif);background:var(--paper);border:1px solid #cbc2ad;
    padding:6px 12px;color:var(--ink);display:inline-block;font-size:12.6px;
  }
  .reader .sheet{padding:22px 26px 30px}
  .reader-scroll::-webkit-scrollbar,.timeline::-webkit-scrollbar{width:10px}
  .reader-scroll::-webkit-scrollbar-thumb,.timeline::-webkit-scrollbar-thumb{
    background:#bdb49f;border:3px solid transparent;background-clip:content-box;
  }

  @media (max-width:900px){
    body.index{height:auto;overflow:auto}
    .app-main{grid-template-columns:1fr}
    .list-col{border-right:0;border-bottom:1px solid #b3aa95}
    .timeline{max-height:44vh}
    .reader-scroll{overflow:visible;padding:12px}
  }
  @media print{
    .app-bar,.list-col,.reader-bar{display:none}
    .app-main{display:block;background:#fff}
    .reader-scroll{overflow:visible;padding:0}
  }
</style>
</head>
<body class="index">

  <header class="app-bar">
    <div class="brand">AI news <small>aihot.news · 日报 / 周报 / 月报</small></div>
    <div class="app-meta" id="appMeta"></div>
  </header>

  <main class="app-main">
    <aside class="list-col">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="timeline" id="timeline"></div>
    </aside>

    <section class="reader">
      <div class="reader-bar">
        <span id="readerTitle">未选择</span>
        <span class="acts" id="readerActs"></span>
      </div>
      <div class="reader-scroll" id="reader">
        <div class="empty"><b>AI news</b><span>正在读取目录…</span></div>
      </div>
    </section>
  </main>

<script>
(function(){
  const KINDS = [{key:'daily',label:'日报'},{key:'weekly',label:'周报'},{key:'monthly',label:'月报'}];
  const KIND = Object.fromEntries(KINDS.map(k=>[k.key,k.label]));
  let catalog = null, curKind = 'daily', curId = null;
  const cache = {};                       // 已读入的期，按 id 缓存

  const esc = s => String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<em>$1</em>');

  /* ── 一期报纸的渲染（与 assets/newspaper.css 的类名一一对应） ────────── */
  function story(it){
    const head = it.url ? `<a href="${esc(it.url)}">${md(it.title)}</a>` : md(it.title);
    const src = (it.source || it.date)
      ? `<div class="src">${md(it.source||'')}${it.date?` · <span class="t">${md(it.date)}</span>`:''}</div>` : '';
    return `<article class="story">
      <h4>${head}</h4>${src}
      ${it.body?`<p>${md(it.body)}</p>`:''}
      ${it.extra?`<p class="ext">${md(it.extra)}</p>`:''}
    </article>`;
  }
  function section(s){
    return `<section class="section">
      <div class="section-head"><h2>${md(s.name)}</h2><span class="cn-num">${md(s.num||'')}</span></div>
      ${s.note?`<p class="topic-note">${md(s.note)}</p>`:''}
      <div class="${s.cols===2?'cols two':'cols'}">${s.items.map(story).join('')}</div>
    </section>`;
  }
  function leadHtml(d){
    const L = d.lead;
    const paras = (L.paragraphs||[]).map((p,i)=>`<p${i===0?' class="first"':''}>${md(p)}</p>`).join('');
    const src = L.source ? `<p class="src-line">${md(L.source)}</p>` : '';
    let aside = '';
    if (L.aside){
      const items = (L.aside.items||[]).map(it=>`<div class="item"><p>${
        it.title?`<b>${md(it.title)}</b>——${md(it.text)}`:md(it.text)}</p></div>`).join('');
      aside = `<aside class="lead-side">
        <h3>${md(L.aside.title)}</h3>${items}
        ${L.aside.more?`<div class="more">${md(L.aside.more)}</div>`:''}
      </aside>`;
    }
    return `<section class="section">
      <div class="section-head"><h2>${d.kind==='daily'?'头条':'本期头条'}</h2><span class="cn-num">01</span></div>
      <div class="lead${aside?'':' lead--solo'}">
        <div class="lead-main">
          ${L.kicker?`<div class="kicker">${md(L.kicker)}</div>`:''}
          <h1${(L.title||'').length>26?' class="is-long"':''}>${md(L.title)}</h1>
          ${L.deck?`<p class="deck">${md(L.deck)}</p>`:''}
          ${paras}${src}
        </div>${aside}
      </div>
    </section>`;
  }
  function renderDoc(d){
    const dc = d.dateline.map(x=>`<span>${md(x)}</span>`).join(' <span class="sep">◆</span> ');
    const brief = d.brief && d.brief.length
      ? `<div class="brief"><span class="k">${md(d.briefLabel)}</span>${
          d.brief.map(x=>`<div class="v">${md(x)}</div>`).join('')}</div>` : '';
    const stats = d.stats && d.stats.length
      ? `<div class="stats">${d.stats.map(s=>`<div class="s"><span class="n">${md(s.n)}</span><span class="l">${md(s.l)}</span></div>`).join('')}</div>` : '';
    const foot = d.footer.lines.map(x=>`${md(x)}<br>`).join('');
    return `<div class="sheet sheet--flat doc-wrap">
      <div class="topline">
        <span>${md(d.masthead.cn)} · 编辑部精选</span>
        <span>数据来源 · AIHOT（aihot.news）</span>
        <span>${md(d.edition)}</span>
      </div>
      <header class="masthead"><h1 class="cn">${md(d.masthead.cn)}</h1><div class="en">${md(d.masthead.en)}</div></header>
      <div class="dateline">${dc}</div>
      ${brief}${stats}
      ${leadHtml(d)}
      ${d.sections.map(section).join('')}
      <footer class="footer">
        <span class="stamp">${md(d.footer.stamp)}</span>
        <p>${foot}字体：Maple Mono NF CN（自托管，见 assets/fonts/）。</p>
      </footer>
    </div>`;
  }

  /* ── 左栏 ───────────────────────────────────────────────────────────── */
  const $timeline = document.getElementById('timeline');
  const $tabs = document.getElementById('tabs');
  const $reader = document.getElementById('reader');
  const $title = document.getElementById('readerTitle');
  const $acts = document.getElementById('readerActs');

  // 读一期。404 = 确实还没写；其他错（断流/解析失败）重试，
  // 不能因为一次瞬时失败就把这一期从列表里弄丢。
  async function loadDoc(id, tries = 3){
    if (cache[id]) return cache[id];
    for (let i = 0; i < tries; i++){
      try {
        const r = await fetch(`data/${id}.json`);
        if (r.status === 404) return null;
        if (r.ok) return (cache[id] = await r.json());
      } catch (_) { /* 重试 */ }
      await new Promise(res => setTimeout(res, 100 * (i + 1)));
    }
    return null;
  }

  // 只列已生成的期；没有 JSON 的不出现在列表里
  const listOf = k => catalog.timeline
    .filter(e => e.kind === k && e.available)
    .sort((a,b) => b.id.localeCompare(a.id));

  function drawTabs(){
    $tabs.innerHTML = KINDS.map(k=>{
      const l = listOf(k.key);
      return `<button role="tab" data-kind="${k.key}" aria-selected="${k.key===curKind}">
        ${k.label}<span class="c">${l.length}</span></button>`;
    }).join('');
  }
  function drawTimeline(){
    let out = '', year = '';
    for (const e of listOf(curKind)){
      const y = e.id.slice(0,4);
      if (y !== year){ year = y; out += `<div class="tl-year">${y}</div>`; }
      const d = cache[e.id];
      out += `<button class="card" data-id="${e.id}" aria-current="${e.id===curId}">
        <span class="date">${esc(e.label)}</span>
        ${d?`<span class="head">${md(d.lead.title)}</span>`:''}
        <span class="meta">${esc(e.window)}${d&&d.edition?` · ${esc(d.edition)}`:''}</span>
      </button>`;
    }
    $timeline.innerHTML = out || '<div class="tl-year">暂无内容</div>';
  }

  // 把一期渲染到右栏（索引模式与分享模式共用）
  function show(d, label){
    $reader.innerHTML = renderDoc(d);
    $reader.scrollTop = 0;
    $title.innerHTML = `<b>${esc(KIND[d.kind]||'')} · ${esc(label || d.edition)}</b>　${esc(d.edition)}　${esc(d.lead.title)}`;
    $acts.innerHTML = `<a href="#" data-print>打印本页</a><a href="#" data-share>分享</a>`
                    + `<span class="share-hint"></span>`;
  }

  async function open(id){
    const entry = catalog.timeline.find(e=>e.id===id);
    if (!entry || !entry.available) return;
    curId = id;
    const d = await loadDoc(id);
    if (!d){
      $title.textContent = entry.label;
      $reader.innerHTML = `<div class="empty"><b>读不到 data/${esc(id)}.json</b>
        <span>文件不存在，或者读取失败了，刷新试试。</span></div>`;
      return;
    }
    if (id !== curId) return;                       // 期间又点了别的
    show(d, entry.label);
    try { history.replaceState(null,'','#'+id); } catch(e){}
    drawTimeline();
  }

  /* 分享：链接只是在 URL 上带一个 ?doc=<id> */
  const shareUrl = id => `${location.origin}${location.pathname}?doc=${encodeURIComponent(id)}`;

  async function copyShare(el){
    if (!curId) return;
    const url = shareUrl(curId);
    const hint = el.parentNode.querySelector('.share-hint');
    let ok = false;
    try {
      await navigator.clipboard.writeText(url);
      ok = true;
    } catch (_) {                                   // 退回到老办法
      const ta = document.createElement('textarea');
      ta.value = url; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
    }
    // 按钮文案始终保持「分享」，只在旁边冒一个小提示
    if (hint){
      hint.textContent = ok ? '已复制' : '复制失败';
      hint.classList.add('on');
      clearTimeout(hint._t);
      hint._t = setTimeout(() => hint.classList.remove('on'), 1400);
    }
  }

  /* ── 启动 ───────────────────────────────────────────────────────────── */
  function notice(msg){
    $timeline.innerHTML = '<div class="tl-year">目录未加载</div>';
    $reader.innerHTML = msg;
  }

  (async function boot(){
    // 分享模式：?doc=<id> —— 只渲染这一期，不加载目录、不拉全量数据
    const shared = new URLSearchParams(location.search).get('doc');
    if (shared){
      document.body.classList.add('shared');
      const d = await loadDoc(shared);
      if (!d){
        $reader.innerHTML = `<div class="empty"><b>没有 data/${esc(shared)}.json</b>
          <span>链接里这一期不存在，检查一下 ?doc= 后面的 id。</span></div>`;
        return;
      }
      curId = shared;
      show(d, (d.dateline[0] || '').replace(/\*\*/g, ''));
      document.title = `${d.masthead.cn} · ${d.edition}`;
      return;
    }

    try {
      const r = await fetch('data/catalog.json', {cache:'no-cache'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      catalog = await r.json();
    } catch (err){
      notice(`<div class="empty">
        <b>需要用一个本地服务打开</b>
        <span>浏览器不允许页面在 file:// 下读取 JSON，所以请在这个目录里起一个静态服务：</span>
        <code>python3 -m http.server 8137</code>
        <span>然后打开 http://localhost:8137/　（macOS 双击 serve.command 也可以）</span>
        <span style="opacity:.7">${esc(err.message)}</span></div>`);
      document.getElementById('appMeta').textContent = '数据未加载';
      return;
    }
    // 登记了但 JSON 还没写的期，就是「待生成」。启动时把它们读进来，
    // 卡片上就能直接显示头条标题。限并发，避免一口气砸几百个请求。
    const queue = catalog.timeline.slice();
    await Promise.all(Array.from({length: Math.min(6, queue.length)}, async () => {
      while (queue.length){
        const e = queue.shift();
        e.available = !!(await loadDoc(e.id));   // 404 → 没这一期；失败会重试
      }
    }));
    document.getElementById('appMeta').innerHTML =
      `共 ${catalog.timeline.length} 期登记 · ${catalog.timeline.filter(e=>e.available).length} 期已生成<br>`
      + new Date().toLocaleDateString('zh-CN');

    const hash = decodeURIComponent(location.hash.replace('#',''));
    const withDoc = catalog.timeline.filter(e=>e.available);
    const first = withDoc.find(e=>e.id===hash) ? hash
      : ((withDoc.filter(e=>e.kind==='daily').sort((a,b)=>b.id.localeCompare(a.id))[0] || withDoc[0])||{}).id;
    if (first){
      curKind = (catalog.timeline.find(e=>e.id===first)||{}).kind || curKind;
      drawTabs(); drawTimeline(); open(first);
    } else { drawTabs(); drawTimeline(); }
  })();

  $tabs.addEventListener('click', ev=>{
    const b = ev.target.closest('button[data-kind]');
    if (!b) return;
    curKind = b.dataset.kind; drawTabs(); drawTimeline();
  });
  $timeline.addEventListener('click', ev=>{
    const c = ev.target.closest('.card[data-id]');
    if (c) open(c.dataset.id);
  });
  $acts.addEventListener('click', ev=>{
    if (ev.target.closest('[data-print]')){ ev.preventDefault(); window.print(); return; }
    const sh = ev.target.closest('[data-share]');
    if (sh){ ev.preventDefault(); copyShare(sh); }
  });
})();
</script>
</body>
</html>
